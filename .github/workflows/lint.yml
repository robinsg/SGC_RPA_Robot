name: Lint

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'ts_backup/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'ts_backup/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff check
        run: ruff check robot_py/

      - name: Run black check
        run: black --check robot_py/

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: ts_backup
