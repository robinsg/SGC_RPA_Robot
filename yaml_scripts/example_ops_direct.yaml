definitions:
  submit_enter: &submit_enter
    type: "send_key"
    key: "Enter"
    description: "Send Enter"

name: "WRKACTJOB Test"
description: "Logs into a TN5250 session and checks the main menu"
tmux_session: "5250_robot"

steps:
  # Load the common login steps for direct connection
  - !include common/example_direct_ip_login.yaml

  - type: "send_text"
    text: "wrkactjob"
    description: "wrkactjob command"

  - *submit_enter

  - type: "send_key"
    key: "F9"
    description: "Move to command line"

  - type: "send_text"
    text: "signoff"
    description: "signoff command"

  - type: "send_key"
    key: "Field_exit"
    description: "Field Exit"

  #  - type: "send_key"
  #    key: "Enter"
  #    description: "Submit signoff"
  - *submit_enter

  - type: "capture"
    filename: "last_screen.txt"
    description: "Save final state"
